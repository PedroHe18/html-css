<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagem dinamica</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegador.</p>

    <picture>
        <source media="(max-width: 710px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1025px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="Imagem flexível">
    </picture>

    <h1>Reproduzindo Áudio</h1>
    <p>Vamos aprender a reproduzir áudios em HTML5.</p>
     <audio preload="metadata" autoplay controls loop>
        <source src="midia/Wildfire - Jessie Villa.mp3" type="audio/mpeg">
        <source src="midia/Wildfire - Jessie Villa.ogg" type="audio/ogg">
        <source src="midia/Wildfire - Jessie Villa.wav" type="audio/wav">
        <!-- wav é muito pesado -->
        <p>Infelizmente seu navegador não consegue reproduzir áudio. <a href="midia/Wildfire - Jessie Villa.mp3">Clique aqui para baixar o arquivo MP3</a></p>
     </audio>
</body>
</html>
