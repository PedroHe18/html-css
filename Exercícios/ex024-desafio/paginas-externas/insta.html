<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0px;
            margin: 0px;
            font-family: Arial, Helvetica, sans-serif;
        }

        ::-webkit-scrollbar {
            width: 0px;
            height: 0px;
        }
        
        body {
            display: grid;
            text-align: center;
        }

        img {
            width: 100vw;
        }

        a {
            background-color: darkred;
            text-decoration: none;
            text-align: center;
            font-size: 1.5em;
            color: white;
            padding-block: 15px;
            display: block;
        }

        a:hover {
            background-color: red;
        }
    </style>
</head>
<body>
    <img src="../imagens/tela-instagram.jpg" alt="Canal do YouTube">
