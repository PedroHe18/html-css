<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafos</title>
</head>
<body>
    <h1>Parágrafo e quebra de linhas</h1>
    <hr>
    <p>Voce pode escrever
        um parágrafo de 
        qualquer jeito.
        Basta colocar tudo
        no meio do par de tags
        &lt;p&gt; e &lt;p&gt;
    </p>
    <p>Se precisar quebrar
        o texto em algum lugar específico <br> como esse,
         voce pode usar a tag &lt;br&gt;.
    </p>
    <p>Vamos adicionar alguns símbolos especiais:
        &reg;
        &copy;
        &euro;
        &pound;
        &yen;
        &cent;
        &delta;
        &uarr;
        😁
        ou
        &#x1F601;
    </p>
</body>
</html>
