<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: lightsalmon;
            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
        }

        /*
         Flex = flex-gorw + flex-shrink + flex-basis
        
         flex: 0 1 auto
            =
         flex: initial
         - base do flex
         -------------
         flex: 0 0 auto
            =
         flex: none
         - nada flexível
         -------------
         flex: 1 1 auto
            =
         flex: auto
         - totalmente flexível
         -------------
         flex: 3
            =
         flex: 3 1 auto
         - se colocar apenas um número ele vai para o grow, pois ele é o primeiro
        */

        div#cxA {
            flex: 0 1 150px;
        }

        div#cxB {
            flex: 2 0 150px;
        }

        div#cxC {
            flex: 1 2 150px;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
    </div>
</body>
</html>
